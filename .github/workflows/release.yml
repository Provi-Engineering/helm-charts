name: Release Charts

on:
  push:
    branches:
      - main
      - ci-testing
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install test dependencies
        run: |
          make install

      - name: Test
        run: |
          make check

  security:
    runs-on: ubuntu-latest
    container:
      image: snyk/snyk:node
      volumes:
        - ${{ github.workspace }}:/helm_charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Prepare fixture dependencies
        run: |
          COMMON_VERSION=$(awk -F': ' '/^version:/ {print $2}' charts/common/Chart.yaml)
          bash scripts/update-fixture-charts.sh "$COMMON_VERSION"

      - name: Snyk IAC test
        env:
          SNYK_TOKEN : ${{ secrets.SNYK_TOKEN }}
        run: |
          helm template -f ./test/fixtures/microservice/values-basic.yaml ./test/fixtures/microservice/ > ./output.yaml
          snyk iac test ./output.yaml

  release:
    if: github.event_name == 'push'
    needs: [test, security]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install helm deps
        run: |
          helm dependency build "${GITHUB_WORKSPACE}/charts/common"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
